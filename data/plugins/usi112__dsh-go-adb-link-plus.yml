url: https://github.com/usi112/dsh-go-adb-link-plus
name: usi112/dsh-go-adb-link-plus
category: dev
description:
  en: "A hardened take on dsh-go-adb-link: port scanning, wireless pairing fallback, and a panel for state/port/client with connect, scan, disconnect and copy-command actions. Installs adb itself when the runtime reset removed it. Tested on DSH Go 1.0.16."
  zh: "dsh-go-adb-link 的加固二改：端口扫描、无线配对兜底，面板里能看状态/端口/客户端并执行连接、扫描、断开、复制命令；运行时被重置、adb 缺失时会自己把它装回来。已在 DSH Go 1.0.16 上验证。"
